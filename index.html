<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course | Bulchana School CyberLab</title>

<meta name="description" content="Learn with Bulchana School CyberLab.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --navy: #102a63;
    --blue: #075bea;
    --light-blue: #eaf3ff;
    --text: #172b4d;
    --muted: #64748b;
    --border: #dce8f8;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: #f7faff;
    color: var(--text);
    line-height: 1.7;
}

header {
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
}

.navbar {
    max-width: 1100px;
    margin: auto;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    color: var(--navy);
    font-size: 19px;
    font-weight: 800;
}

.navbar a {
    text-decoration: none;
    color: var(--blue);
    font-weight: 700;
}

.container {
    max-width: 950px;
    margin: 35px auto;
    padding: 0 18px;
}

.back-button {
    display: inline-block;
    margin-bottom: 22px;
    color: var(--blue);
    font-weight: 700;
    text-decoration: none;
}

.course-header {
    background: linear-gradient(120deg, #071d49, #075bea);
    color: white;
    padding: 35px 28px;
    border-radius: 16px;
    margin-bottom: 30px;
}

.course-header h1 {
    font-size: clamp(26px, 5vw, 38px);
    line-height: 1.3;
    margin-bottom: 12px;
}

.course-header p {
    color: #e3efff;
}

.section-title {
    color: var(--navy);
    margin-bottom: 18px;
    font-size: 24px;
}

.lesson-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 23px;
    margin-bottom: 18px;
    box-shadow: 0 6px 20px rgba(16,42,99,.05);
}

.lesson-card h2 {
    color: var(--navy);
    font-size: 19px;
    margin-bottom: 8px;
}

.lesson-description {
    color: var(--muted);
    margin-bottom: 12px;
}

.lesson-content {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.9;
    margin-top: 15px;
}

.lesson-links {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 18px;
}

.lesson-links a {
    color: var(--blue);
    font-weight: 700;
    text-decoration: none;
}

.status-message {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    color: var(--muted);
}

footer {
    background: #09265c;
    color: white;
    padding: 25px;
    text-align: center;
    margin-top: 60px;
    font-size: 13px;
}

@media(max-width: 600px) {
    .container {
        margin-top: 22px;
    }

    .course-header {
        padding: 25px 20px;
    }

    .lesson-card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <nav class="navbar">
        <div class="brand">🛡️ Bulchana CyberLab</div>
        <a href="index.html#courses">Home</a>
    </nav>
</header>

<main class="container">

    <a href="index.html#courses" class="back-button">
        ← Back to Courses
    </a>

    <section class="course-header">
        <h1 id="courseTitle">Loading course...</h1>
        <p id="courseDescription"></p>
    </section>

    <section>
        <h2 class="section-title">📚 Course Lessons</h2>

        <div id="lessonsContainer">
            <div class="status-message">
                Loading lessons...
            </div>
        </div>
    </section>

</main>

<footer>
    <p><strong>🛡️ Bulchana School CyberLab</strong></p>
    <p>Empowering Students Through Technology.</p>
    <p>© 2026 Bulchana School CyberLab. All rights reserved.</p>
</footer>

<script>

/* SUPABASE CONNECTION */

const SUPABASE_URL =
    "https://gdawpyrjscrocjxdsphl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_V1ftP1gprlI0KJqeLD6e5w_Tl00butF";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* GET COURSE ID FROM URL */

const courseId = new URLSearchParams(
    window.location.search
).get("id");


/* SAFE EXTERNAL LINKS */

function safeExternalURL(value) {
    if (!value) return "";

    try {
        const url = new URL(value);

        if (
            url.protocol !== "https:" &&
            url.protocol !== "http:"
        ) {
            return "";
        }

        return url.href;

    } catch {
        return "";
    }
}


/* DISPLAY COURSE */

async function loadCourse() {

    const title = document.getElementById("courseTitle");

    const description =
        document.getElementById("courseDescription");

    const lessonsContainer =
        document.getElementById("lessonsContainer");


    if (!courseId) {

        title.textContent = "Course not found";

        description.textContent =
            "Please return to the courses page and select a course.";

        lessonsContainer.innerHTML = "";

        return;
    }


    /* GET PUBLISHED COURSE */

    const { data: course, error: courseError } =
        await supabaseClient
            .from("courses")
            .select("id, title, description")
            .eq("id", courseId)
            .eq("is_published", true)
            .maybeSingle();


    if (courseError || !course) {

        title.textContent = "Course unavailable";

        description.textContent =
            "This course could not be found or is not published.";

        lessonsContainer.innerHTML = "";

        return;
    }


    title.textContent = course.title;

    description.textContent =
        course.description || "";

    document.title =
        course.title + " | Bulchana School CyberLab";


    /* GET PUBLISHED LESSONS */

    const { data: lessons, error: lessonError } =
        await supabaseClient
            .from("lessons")
            .select(`
                id,
                title,
                description,
                lesson_content,
                video_url,
                file_url,
                lesson_order
            `)
            .eq("course_id", courseId)
            .eq("is_published", true)
            .order("lesson_order", {
                ascending: true
            });


    if (lessonError) {

        lessonsContainer.innerHTML = `
            <div class="status-message">
                Unable to load lessons. Please try again later.
            </div>
        `;

        return;
    }


    if (!lessons || lessons.length === 0) {

        lessonsContainer.innerHTML = `
            <div class="status-message">
                No published lessons are available yet.
            </div>
        `;

        return;
    }


    /* DISPLAY LESSONS */

    lessonsContainer.innerHTML = "";

    lessons.forEach((lesson, index) => {

        const card = document.createElement("article");

        card.className = "lesson-card";


        const heading = document.createElement("h2");

        heading.textContent =
            "Lesson " + (index + 1) + ": " + lesson.title;

        card.appendChild(heading);


        if (lesson.description) {

            const descriptionElement =
                document.createElement("p");

            descriptionElement.className =
                "lesson-description";

            descriptionElement.textContent =
                lesson.description;

            card.appendChild(descriptionElement);
        }


        if (lesson.lesson_content) {

            const content =
                document.createElement("div");

            content.className = "lesson-content";

            content.textContent =
                lesson.lesson_content;

            card.appendChild(content);
        }


        const links =
            document.createElement("div");

        links.className = "lesson-links";


        const videoURL =
            safeExternalURL(lesson.video_url);

        const fileURL =
            safeExternalURL(lesson.file_url);


        if (videoURL) {

            const videoLink =
                document.createElement("a");

            videoLink.href = videoURL;

            videoLink.textContent =
                "▶ Watch Lesson Video";

            videoLink.target = "_blank";

            videoLink.rel =
                "noopener noreferrer";

            links.appendChild(videoLink);
        }


        if (fileURL) {

            const fileLink =
                document.createElement("a");

            fileLink.href = fileURL;

            fileLink.textContent =
                "📄 Open Learning Material";

            fileLink.target = "_blank";

            fileLink.rel =
                "noopener noreferrer";

            links.appendChild(fileLink);
        }


        card.appendChild(links);

        lessonsContainer.appendChild(card);

    });

}


/* START */

loadCourse();

</script>

</body>
</html>
